<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result - {{ course.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white p-4 text-center rounded-top-4">
                <h2 class="fw-bold mb-0">Exam Result</h2>
                <p class="mb-0 fs-5">{{ course.name }}</p>
            </div>
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h3 class="display-5 fw-bold text-dark">{{ total_score }} / {{ total_possible }}</h3>
                    <div class="progress my-3" style="height: 25px;">
                        <div class="progress-bar {% if percentage >= 70 %}bg-success{% else %}bg-danger{% endif %}" 
                             role="progressbar" 
                             style="width: {{ percentage }}%;" 
                             aria-valuenow="{{ percentage }}" 
                             aria-valuemin="0" 
                             aria-valuemax="100">
                            {{ percentage }}%
                        </div>
                    </div>
                    {% if percentage >= 70 %}
                    <span class="badge bg-success fs-5 px-4 py-2">Congratulations! You Passed.</span>
                    {% else %}
                    <span class="badge bg-danger fs-5 px-4 py-2">Keep Learning & Try Again!</span>
                    {% endif %}
                </div>
                
                <div class="text-center mt-4">
                    <a href="{% url 'course_details' course.id %}" class="btn btn-outline-primary btn-lg">Back to Course Details</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
